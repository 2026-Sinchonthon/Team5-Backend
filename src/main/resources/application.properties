spring.application.name=5dyssey

# Database
# Defaults to H2 in-memory. Override these with environment variables when an
# external database is introduced (for example, SPRING_DATASOURCE_URL).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:odyssey;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${SPRING_H2_CONSOLE_PATH:/h2-console}
# Docker 컨테이너에서는 호스트 브라우저 요청이 원격 연결로 인식된다.
# Compose 개발 환경에서만 환경변수로 true를 주입한다.
spring.h2.console.settings.web-allow-others=${SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS:false}

# JWT access token
jwt.secret=${JWT_SECRET:development-only-secret-key-must-be-at-least-32-bytes}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:PT24H}

# AWS S3 file storage
aws.s3.bucket=${AWS_S3_BUCKET:team5-odyssey-uploads-2026}
aws.s3.region=${AWS_S3_REGION:ap-northeast-2}

# Multipart file upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# Ollama LLM (job post AI refine)
ollama.base-url=${OLLAMA_BASE_URL:http://100.74.196.80:11434}
ollama.model=${OLLAMA_MODEL:exaone3.5:7.8b}
ollama.review-model=${OLLAMA_REVIEW_MODEL:qwen2.5:7b}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:60}
